        <text x="14" y="18" fill="#34d399" font-size="9.5" class="font-mono" font-weight="700">03 / DATA &amp; STORAGE</text>
        <text x="14" y="36" fill="#f8fafc" font-size="12" class="font-sans" font-weight="600">MongoDB, Mongoose ODM</text>
        <text x="14" y="52" fill="#94a3b8" font-size="10" class="font-sans">Aggregation Pipelines, Indexing, Modeling</text>
