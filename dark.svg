      <rect x="0" y="0" width="452" height="232" rx="8" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>
      <!-- Restrained Grid Background -->
      <rect x="0" y="26" width="452" height="206" fill="url(#gridPatternDark)"/>
      <!-- Subtle Scanlines Overlay -->
      <rect x="0" y="26" width="452" height="206" fill="url(#scanlinesDark)" pointer-events="none"/>
      
      <!-- Box Header -->
      <rect x="0" y="0" width="452" height="26" rx="8" fill="#0d1527"/>
      <rect x="0" y="18" width="452" height="8" fill="#0d1527"/>
      <line x1="0" y1="26" x2="452" y2="26" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="17" fill="#64748b" font-size="9.5" class="font-mono" font-weight="600">SYSTEM ARCHITECTURE // COMPONENT GRAPH</text>

      <!-- Tier 1: Client Layer -->
      <g transform="translate(14, 38)">
        <rect x="0" y="0" width="124" height="66" rx="6" fill="#101b30" stroke="#1e3a5f" stroke-width="1"/>
        <text x="10" y="16" fill="#38bdf8" font-size="9" class="font-mono" font-weight="700">CLIENT LAYER</text>
        <text x="10" y="33" fill="#f8fafc" font-size="10" class="font-sans" font-weight="600">React 19 / Vite</text>
        <text x="10" y="47" fill="#94a3b8" font-size="9" class="font-sans">Redux Toolkit / RTK</text>
        <text x="10" y="59" fill="#64748b" font-size="8.5" class="font-mono">Tailwind CSS v4</text>
      </g>

      <!-- Connection 1 -> 2 -->
