      <g transform="translate(314, 38)">
        <rect x="0" y="0" width="124" height="66" rx="6" fill="#18172d" stroke="#432c66" stroke-width="1"/>
        <text x="10" y="16" fill="#c084fc" font-size="9" class="font-mono" font-weight="700">AI &amp; ENGINE</text>
        <text x="10" y="33" fill="#f8fafc" font-size="10" class="font-sans" font-weight="600">Gemini 2.5 / LLM</text>
        <text x="10" y="47" fill="#94a3b8" font-size="9" class="font-sans">LangChain Reasoning</text>
        <text x="10" y="59" fill="#64748b" font-size="8.5" class="font-mono">SearXNG Search API</text>
      </g>

      <!-- Vertical Feeders to Storage -->
      <path d="M 226 104 L 226 124 L 130 124 L 130 136" fill="none" stroke="#243350" stroke-width="1.5"/>
      <polygon points="130,137 127,133 133,133" fill="#243350"/>

      <path d="M 226 104 L 226 124 L 322 124 L 322 136" fill="none" stroke="#243350" stroke-width="1.5"/>
      <polygon points="322,137 319,133 325,133" fill="#243350"/>

      <!-- Bottom Tier: Database & Infrastructure -->
      <g transform="translate(14, 138)">
        <rect x="0" y="0" width="204" height="76" rx="6" fill="#0d1b1d" stroke="#134e4a" stroke-width="1"/>
        <text x="10" y="16" fill="#34d399" font-size="9" class="font-mono" font-weight="700">PERSISTENCE LAYER</text>
        <text x="10" y="33" fill="#f8fafc" font-size="11" class="font-sans" font-weight="600">MongoDB &amp; Mongoose</text>
        <text x="10" y="49" fill="#94a3b8" font-size="9.5" class="font-sans">Aggregations · Indexing · Pipelines</text>
        <text x="10" y="63" fill="#64748b" font-size="8.5" class="font-mono">Secure Schema &amp; Role Access</text>
      </g>

      <g transform="translate(234, 138)">
        <rect x="0" y="0" width="204" height="76" rx="6" fill="#141c2b" stroke="#1e3a5f" stroke-width="1"/>
        <text x="10" y="16" fill="#38bdf8" font-size="9" class="font-mono" font-weight="700">DEV &amp; CLOUD INFRA</text>
        <text x="10" y="33" fill="#f8fafc" font-size="11" class="font-sans" font-weight="600">Docker &amp; Self-Hosted Hub</text>
        <text x="10" y="49" fill="#94a3b8" font-size="9.5" class="font-sans">Razorpay Payments · ImageKit CDN</text>
        <text x="10" y="63" fill="#64748b" font-size="8.5" class="font-mono">Git Flow · Vercel · REST Testing</text>
      </g>
    </g>

    <!-- Bottom Terminal Active State -->
    <g transform="translate(38, 482)" class="font-mono">
      <text x="0" y="0" fill="#64748b" font-size="11">$ <tspan fill="#38bdf8">uptime</tspan> --engineering</text>
      <text x="0" y="17" fill="#34d399" font-size="11">● active (building &amp; learning) · ready for production</text>
      
      <!-- Prompt Line with Blinking Cursor -->
      <text x="0" y="38" fill="#64748b" font-size="11.5">rijvan@dev:~$ <tspan fill="#f8fafc">git commit -m "build scalable web apps"</tspan></text>
      <rect x="376" y="27" width="7.5" height="13" fill="#38bdf8" class="cursor"/>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: SYSTEM.INFO ================= -->
  <g id="rightColumn">
    <!-- Panel Container -->
    <rect x="520" y="60" width="636" height="526" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1"/>

