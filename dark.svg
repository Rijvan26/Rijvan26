        <line x1="0" y1="0" x2="3" y2="66" stroke="#818cf8" stroke-width="3"/>
        <text x="14" y="18" fill="#818cf8" font-size="9.5" class="font-mono" font-weight="700">02 / BACKEND &amp; REALTIME</text>
        <text x="14" y="36" fill="#f8fafc" font-size="12" class="font-sans" font-weight="600">Node.js, Express.js 5, Socket.IO</text>
        <text x="14" y="52" fill="#94a3b8" font-size="10" class="font-sans">RESTful APIs, JWT Auth &amp; Cookies, MVC/DAO</text>
