        <text x="10" y="16" fill="#818cf8" font-size="9" class="font-mono" font-weight="700">API &amp; REALTIME</text>
        <text x="10" y="33" fill="#f8fafc" font-size="10" class="font-sans" font-weight="600">Express 5 / Node</text>
        <text x="10" y="47" fill="#94a3b8" font-size="9" class="font-sans">Socket.IO WebSockets</text>
        <text x="10" y="59" fill="#64748b" font-size="8.5" class="font-mono">JWT &amp; Auth Guard</text>
