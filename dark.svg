    <rect x="24" y="60" width="480" height="526" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Subheader / Shell Tab -->
    <path d="M 24 72 A 12 12 0 0 1 36 60 L 492 60 A 12 12 0 0 1 504 72 L 504 94 L 24 94 Z" fill="#0b1220"/>
    <line x1="24" y1="94" x2="504" y2="94" stroke="#1e293b" stroke-width="1"/>
    
    <rect x="36" y="71" width="10" height="10" rx="2" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="54" y="80" fill="#94a3b8" font-size="11" class="font-mono" font-weight="600">SESSION // VISUAL.MAP</text>
    <rect x="424" y="69" width="66" height="16" rx="4" fill="#14213d"/>
    <text x="432" y="81" fill="#38bdf8" font-size="9" class="font-mono" font-weight="600">MERN_ENV</text>

    <!-- Terminal Transcript -->
    <g transform="translate(38, 115)" class="font-mono">
      <!-- Line 1: Identity -->
      <text x="0" y="0" fill="#64748b" font-size="11.5">$ <tspan fill="#38bdf8">whoami</tspan></text>
      <text x="0" y="18" fill="#f8fafc" font-size="12" font-weight="600">Rizwan Khan <tspan fill="#94a3b8" font-weight="400">(@Rijvan26)</tspan></text>

      <!-- Line 2: Role & Tagline -->
      <text x="0" y="42" fill="#64748b" font-size="11.5">$ <tspan fill="#38bdf8">cat</tspan> role.config</text>
      <text x="0" y="60" fill="#cbd5e1" font-size="11.5">MERN Stack &amp; Full-Stack Developer</text>
      <text x="0" y="76" fill="#38bdf8" font-size="10.5">Tagline: "Architecting scalable web software from frontend to database"</text>
    </g>

    <!-- Visual Architecture / Topology Map with Grid and Scanlines -->
    <g transform="translate(38, 218)">
