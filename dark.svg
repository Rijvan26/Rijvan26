<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%" role="img" aria-labelledby="darkTitle darkDesc">
  <title id="darkTitle">Rizwan Khan - Full-Stack &amp; MERN Developer Profile Banner</title>
  <desc id="darkDesc">Technical profile banner showcasing Rizwan Khan's full-stack development skills, verified projects, and system architecture.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Panel Gradients -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c33" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0c1322" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0e172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Subtle Restrained Grid Pattern -->
    <pattern id="gridPatternDark" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>

    <!-- Subtle Scanlines Pattern -->
    <pattern id="scanlinesDark" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, 'Courier New', monospace;
    }
    .font-sans {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: cursorBlink 1.1s step-start infinite;
    }

    @keyframes statusPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.25); opacity: 0.4; }
    }
    .pulse-dot {
      animation: statusPulse 2.4s ease-in-out infinite;
      transform-origin: 1014px 24.5px;
    }

    @keyframes dataFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line {
      stroke-dasharray: 4, 4;
      animation: dataFlow 1.6s linear infinite;
    }
  </style>

  <!-- Outer Frame -->
  <rect x="1.5" y="1.5" width="1177" height="607" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top System Header Bar -->
  <rect x="1.5" y="1.5" width="1177" height="46" rx="16" fill="#0d1527" fill-opacity="0.95"/>
  <rect x="1.5" y="32" width="1177" height="15.5" fill="#0d1527"/>
  <line x1="1.5" y1="47.5" x2="1178.5" y2="47.5" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="28" cy="24" r="5" fill="#ef4444" fill-opacity="0.9"/>
  <circle cx="45" cy="24" r="5" fill="#f59e0b" fill-opacity="0.9"/>
  <circle cx="62" cy="24" r="5" fill="#10b981" fill-opacity="0.9"/>

  <!-- Header Breadcrumb and Status -->
  <text x="85" y="28" fill="#94a3b8" font-size="12" class="font-mono" font-weight="500">rijvan26 <tspan fill="#475569">/</tspan> <tspan fill="#38bdf8">engineering-profile</tspan> <tspan fill="#475569">·</tspan> <tspan fill="#cbd5e1">production-ready</tspan></text>

  <!-- Status Indicator (Right aligned) -->
  <g>
    <rect x="1000" y="14" width="156" height="21" rx="10.5" fill="#14213d" stroke="#243350" stroke-width="1"/>
    <circle cx="1014" cy="24.5" r="4" fill="#34d399"/>
    <circle cx="1014" cy="24.5" r="7" fill="#34d399" fill-opacity="0.25" class="pulse-dot"/>
    <text x="1026" y="28.5" fill="#34d399" font-size="10.5" class="font-mono" font-weight="600">STATUS: OPEN TO WORK</text>
  </g>

